<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Plane — write someone a card</title>
<meta name="description" content="Write a letter, pick an envelope, add a tune, and send one link.">
<meta property="og:title" content="You have a letter">
<meta property="og:description" content="Tap to open it.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FBF3E4">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Cream grid-paper workbench. Maker on the left, live envelope on the right.
     With ?c= in the address, the whole page becomes the card itself. */
  :root {
    --paper: #FBF3E4;
    --paper-2: #FFFBF2;
    --grid: rgba(26,22,20,.055);
    --ink: #17120F;
    --ink-soft: #6B5F55;
    --line: rgba(23,18,15,.14);
    --sun: #F5B931;
    --candy: #FF5FA2;
    --sky: #35B6F2;
    --grass: #2FCF9E;
    --coral: #FF6B4A;
    --grape: #9B7BFF;
    --accent: var(--sun);
    --display: 'Fredoka', 'Trebuchet MS', sans-serif;
    --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --hand: 'Caveat', 'Bradley Hand', cursive;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 26px 26px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 26px 26px,
      radial-gradient(120% 70% at 50% -10%, #FFF9ED 0%, transparent 60%),
      var(--paper);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  .wrap {
    max-width: 1120px; margin: 0 auto;
    padding-block: calc(26px + env(safe-area-inset-top, 0px)) 60px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100%;
  }

  h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 600; text-wrap: balance; line-height: 1.05; }
  h1 { font-size: clamp(2.3rem, 7vw, 3.9rem); letter-spacing: -.02em; }
  p { margin: 0; line-height: 1.6; color: var(--ink-soft); }
  .lede { font-size: clamp(1rem, 2.6vw, 1.12rem); max-width: 46ch; }
  .eyebrow { font-family: var(--display); font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }

  .btn {
    font-family: var(--display); font-weight: 600;
    background: var(--ink); color: var(--paper-2);
    padding: 13px 26px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 4px 0 rgba(23,18,15,.25);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(23,18,15,.25); }
  .btn.sun { background: var(--accent); color: var(--ink); box-shadow: 0 4px 0 rgba(23,18,15,.2); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.ghost:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.sm { padding: 9px 18px; font-size: .92rem; box-shadow: none; }

  .head { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; margin-bottom: 30px; }
  .mark { display: inline-flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 600; font-size: 1.02rem; }
  .mark .dot { width: 28px; height: 28px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; font-size: .95rem; }

  .cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,.9fr); gap: 26px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: minmax(0,1fr); } }

  .panel {
    background: var(--paper-2);
    border: 1.5px solid var(--line);
    border-radius: 26px;
    padding: 22px;
    box-shadow: 0 14px 34px rgba(23,18,15,.07);
    display: flex; flex-direction: column; gap: 18px;
    min-width: 0;
  }
  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .lbl { font-family: var(--display); font-size: .86rem; font-weight: 600; }
  .hint { font-size: .78rem; color: var(--ink-soft); }
  input[type=text], textarea {
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 11px 13px; width: 100%; font-size: .98rem;
  }
  textarea { font-family: var(--hand); font-size: 1.3rem; line-height: 1.35; resize: vertical; min-height: 150px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 440px) { .two { grid-template-columns: 1fr; } }

  .swatches { display: flex; flex-wrap: wrap; gap: 9px; }
  .sw { width: 36px; height: 36px; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(23,18,15,.12); transition: transform .14s ease; }
  .sw[aria-pressed="true"] { transform: scale(1.12); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 3px var(--paper-2), 0 0 0 5px var(--ink); }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font-family: var(--display); font-size: .88rem; font-weight: 500;
    padding: 8px 15px; border-radius: 999px;
    background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--paper-2); box-shadow: none; }

  .stick { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
  .stage {
    background: var(--paper-2); border: 1.5px solid var(--line); border-radius: 26px;
    padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 14px 34px rgba(23,18,15,.07);
  }

  .env {
    position: relative; width: min(320px, 78vw); aspect-ratio: 7 / 5;
    border-radius: 16px; background: var(--accent);
    box-shadow: 0 18px 40px rgba(23,18,15,.22);
  }
  .env .flap {
    position: absolute; inset: 0 0 auto; height: 60%;
    background: rgba(255,255,255,.26);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 16px 16px 0 0;
    transform-origin: top; transition: transform .6s cubic-bezier(.5,-.25,.3,1.4);
    z-index: 3;
  }
  .env.open .flap { transform: rotateX(178deg); }
  .env .seal {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%); z-index: 4;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--candy); color: #fff;
    display: grid; place-items: center;
    font-family: var(--display); font-size: 1.5rem; font-weight: 600;
    box-shadow: 0 5px 14px rgba(23,18,15,.3), inset 0 0 0 3px rgba(255,255,255,.35);
    transition: transform .4s ease, opacity .3s;
  }
  .env.open .seal { transform: translate(-50%,-50%) scale(0) rotate(160deg); opacity: 0; }
  .env .stamp {
    position: absolute; right: 12px; top: 12px; z-index: 4;
    width: 54px; height: 62px; border-radius: 6px; background: var(--paper-2);
    box-shadow: 0 3px 10px rgba(23,18,15,.22);
    display: grid; place-items: center; padding: 4px;
    font-family: var(--display); font-size: .58rem; text-align: center; line-height: 1.15;
    transform: rotate(3deg);
  }
  .env .stamp b { font-size: 1.1rem; display: block; }
  .env .deco { position: absolute; inset: 0; overflow: hidden; border-radius: 16px; z-index: 1; }
  .env .deco span { position: absolute; font-size: 18px; opacity: .55; }
  .env .letter-peek {
    position: absolute; left: 7%; right: 7%; bottom: 8%; height: 62%; z-index: 2;
    background: var(--paper-2); border-radius: 10px;
    box-shadow: 0 -2px 10px rgba(23,18,15,.12);
    display: grid; place-items: center; padding: 10px;
    font-family: var(--hand); font-size: 1.15rem; color: var(--ink-soft); text-align: center;
    transition: transform .55s ease .1s;
  }
  .env.open .letter-peek { transform: translateY(-24%); }
  .tapnote { font-family: var(--display); font-size: .86rem; color: var(--ink-soft); }

  .letter {
    background: var(--paper-2); border-radius: 24px; padding: 26px 24px 28px;
    box-shadow: 0 22px 50px rgba(23,18,15,.18); border: 1.5px solid var(--line);
    width: 100%; max-width: 540px;
    display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center;
    animation: rise .55s cubic-bezier(.2,.9,.3,1) both;
  }
  .letter .photo { width: 100%; max-width: 320px; aspect-ratio: 4/3; object-fit: cover; border-radius: 16px; transform: rotate(-1.4deg); box-shadow: 0 10px 24px rgba(23,18,15,.2); }
  .letter .msg { font-family: var(--hand); font-size: clamp(1.35rem, 5vw, 1.72rem); line-height: 1.38; color: var(--ink); white-space: pre-wrap; max-width: 30ch; }
  .letter .sign { font-family: var(--hand); font-size: clamp(1.4rem, 5.4vw, 1.85rem); font-weight: 700; color: var(--candy); }
  .letter .to { font-family: var(--display); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }

  .card-stage { min-height: calc(100vh - 90px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }

  .sound {
    position: fixed; z-index: 70;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + max(4px, env(safe-area-inset-right, 0px)));
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--paper-2); box-shadow: 0 4px 14px rgba(23,18,15,.18), inset 0 0 0 1.5px var(--line);
    display: grid; place-items: center; font-size: 1.1rem;
  }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 80;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper-2);
    font-family: var(--display); font-size: .92rem;
    padding: 11px 20px; border-radius: 999px;
    box-shadow: 0 10px 24px rgba(23,18,15,.3);
    max-width: 90vw;
  }

  @keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
  .floaty { animation: float 3.6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<button class="sound" id="sound" hidden aria-pressed="false" aria-label="Play music">&#9834;</button>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  /* The letter that loads when nobody has made one yet. Edit freely. */
  var DEFAULT = {
    to: "Sefenya",
    from: "David",
    headline: "Happy birthday",
    message: "The world got a lot brighter the day you showed up in it.\n\nThank you for the laughing, the patience, and for being you without ever trying. Here's to a year that treats you as well as you treat everyone else.",
    colour: "sun",
    pattern: "confetti",
    tune: "bounce",
    photo: false
  };

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var app = document.getElementById('app');
  var $ = function (s, r) { return (r || document).querySelector(s); };

  var COLOURS = [
    { id: 'sun', hex: '#F5B931', name: 'Sunshine' },
    { id: 'candy', hex: '#FF5FA2', name: 'Candy' },
    { id: 'sky', hex: '#35B6F2', name: 'Sky' },
    { id: 'grass', hex: '#2FCF9E', name: 'Grass' },
    { id: 'coral', hex: '#FF6B4A', name: 'Coral' },
    { id: 'grape', hex: '#9B7BFF', name: 'Grape' }
  ];
  var PATTERNS = {
    none: [],
    confetti: ['✦', '●', '▲', '✦', '●', '■', '✦', '●', '▲', '■', '✦', '●'],
    flowers: ['✿', '❀', '✿', '❁', '❀', '✿', '❁', '✿', '❀', '✿'],
    stars: ['✧', '★', '✦', '✧', '★', '✦', '✧', '★', '✦', '✧'],
    hearts: ['♥', '♡', '♥', '♡', '♥', '♡', '♥', '♡', '♥']
  };
  var TUNES = {
    none: null,
    bounce: [523, 659, 784, 659, 880, 784, 659, 587, 523, 659, 1047, 988, 784, 659, 587, 523],
    box: [1047, 1319, 1568, 1319, 1047, 880, 1047, 1319, 988, 1175, 1480, 1175, 988, 784, 988, 1175],
    warm: [392, 494, 587, 494, 440, 523, 659, 523, 392, 494, 587, 698, 587, 494, 440, 392]
  };
  var TUNE_NAMES = { none: 'No music', bounce: 'Party bounce', box: 'Music box', warm: 'Warm and slow' };
  var PATTERN_NAMES = { none: 'Plain', confetti: 'Confetti', flowers: 'Flowers', stars: 'Stars', hearts: 'Hearts' };

  function hex(id) {
    for (var i = 0; i < COLOURS.length; i++) if (COLOURS[i].id === id) return COLOURS[i].hex;
    return COLOURS[0].hex;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------------- link encoding ---------------- */
  function encode(d) {
    var json = JSON.stringify([d.to, d.from, d.headline, d.message, d.colour, d.pattern, d.tune, d.photo ? 1 : 0]);
    var bytes = new TextEncoder().encode(json), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decode(s) {
    try {
      var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var a = JSON.parse(new TextDecoder().decode(bytes));
      return { to: a[0], from: a[1], headline: a[2], message: a[3], colour: a[4], pattern: a[5], tune: a[6], photo: !!a[7] };
    } catch (e) { return null; }
  }

  /* ---------------- confetti ---------------- */
  var cv = document.getElementById('sky'), ctx = cv.getContext('2d'), bits = [], running = false;
  function sizeSky() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  sizeSky();
  addEventListener('resize', sizeSky);
  function burst(x, y, n) {
    if (reduce) return;
    var pal = ['#F5B931', '#FF5FA2', '#35B6F2', '#2FCF9E', '#FF6B4A', '#9B7BFF'];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
      bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
        c: pal[(Math.random() * pal.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        life: 110 + Math.random() * 60 });
    }
    if (bits.length > 800) bits.splice(0, bits.length - 800);
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function rain(n) { if (reduce) return; for (var i = 0; i < n; i++) burst(Math.random() * innerWidth, -20 - Math.random() * 140, 1); }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      b.vy += .22; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
      if (b.life < 0 || b.y > innerHeight + 60) { bits.splice(i, 1); continue; }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.globalAlpha = Math.min(1, b.life / 40); ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    }
    if (bits.length) requestAnimationFrame(tick); else running = false;
  }

  /* ---------------- music ---------------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, gain = null, loopId = null, playing = false, tune = 'bounce';
  function startAudio() {
    if (!AC) return false;
    if (!ac) { ac = new AC(); gain = ac.createGain(); gain.gain.value = .13; gain.connect(ac.destination); }
    if (ac.state === 'suspended') ac.resume();
    return true;
  }
  function note(f, at, dur, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(gain); o.start(at); o.stop(at + dur + .05);
  }
  function loopTune() {
    var seq = TUNES[tune];
    if (!seq || !ac) return;
    var step = tune === 'warm' ? .3 : .22, t = ac.currentTime + .05;
    for (var i = 0; i < seq.length; i++) {
      note(seq[i], t + i * step, step * .9, .55);
      if (i % 4 === 0) note(seq[i] / 2, t + i * step, step * 1.8, .3);
    }
    loopId = setTimeout(loopTune, seq.length * step * 1000);
  }
  function music(on) {
    playing = on;
    var b = document.getElementById('sound');
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? 'Mute music' : 'Play music');
    b.innerHTML = on ? '&#9835;' : '&#9834;';
    if (on) { if (startAudio()) { gain.gain.setTargetAtTime(.13, ac.currentTime, .05); loopTune(); } }
    else { clearTimeout(loopId); if (gain && ac) gain.gain.setTargetAtTime(0, ac.currentTime, .05); }
  }
  document.getElementById('sound').addEventListener('click', function () { music(!playing); });
  function chirp(freqs) {
    if (!playing || !ac) return;
    var t = ac.currentTime;
    for (var i = 0; i < freqs.length; i++) note(freqs[i], t + i * .07, .18, .5);
  }

  function toast(text) {
    var old = $('.toast');
    if (old) old.parentNode.removeChild(old);
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
  }

  /* ---------------- envelope ---------------- */
  function envelopeHTML(d, peek) {
    var marks = PATTERNS[d.pattern] || [], deco = '';
    for (var i = 0; i < marks.length; i++) {
      deco += '<span style="left:' + (6 + (i * 37) % 86) + '%;top:' + (8 + (i * 53) % 80) +
        '%;transform:rotate(' + (((i * 47) % 90) - 45) + 'deg)">' + marks[i] + '</span>';
    }
    var initial = (String(d.to || '?').trim().charAt(0) || '?').toUpperCase();
    var stampDate = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    return '<button class="env floaty" id="env" style="background:' + hex(d.colour) + '" aria-label="Open the envelope">' +
      '<span class="deco">' + deco + '</span>' +
      '<span class="stamp"><b>&#9993;</b>' + stampDate + '</span>' +
      '<span class="letter-peek">' + esc(peek) + '</span>' +
      '<span class="flap"></span>' +
      '<span class="seal">' + esc(initial) + '</span>' +
      '</button>';
  }

  /* ---------------- card mode ---------------- */
  function renderCard(d) {
    tune = d.tune;
    document.getElementById('sound').hidden = (d.tune === 'none');
    app.innerHTML =
      '<div class="card-stage" id="cardStage">' +
        '<span class="eyebrow">For ' + esc(d.to) + '</span>' +
        envelopeHTML(d, 'tap to open') +
        '<p class="tapnote">A letter from ' + esc(d.from) + '</p>' +
      '</div>';
    var env = document.getElementById('env');
    env.addEventListener('click', function () {
      if (env.className.indexOf('open') > -1) return;
      env.className += ' open';
      if (d.tune !== 'none' && !playing) music(true);
      chirp([880, 1174]);
      var r = env.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 70);
      setTimeout(function () { openLetter(d); }, reduce ? 0 : 680);
    });
  }

  function openLetter(d) {
    rain(90);
    chirp([523, 659, 784, 1047]);
    var photo = d.photo ? '<img class="photo" src="photo.jpg" alt="A photo from ' + esc(d.from) + '" onerror="this.remove()">' : '';
    document.getElementById('cardStage').innerHTML =
      '<div class="letter">' +
        '<span class="to">To ' + esc(d.to) + '</span>' +
        '<h1>' + esc(d.headline) + '</h1>' +
        photo +
        '<p class="msg">' + esc(d.message) + '</p>' +
        '<span class="sign">&mdash; ' + esc(d.from) + '</span>' +
      '</div>' +
      '<div class="pills" style="justify-content:center">' +
        '<button class="btn sun sm" id="more">More confetti</button>' +
        '<button class="btn ghost sm" id="shut">Close it up</button>' +
        '<button class="btn ghost sm" id="mine">Make your own</button>' +
      '</div>';
    $('#more').addEventListener('click', function () { rain(120); chirp([784, 988]); });
    $('#shut').addEventListener('click', function () { renderCard(d); });
    $('#mine').addEventListener('click', function () { location.href = location.pathname; });
  }

  /* ---------------- maker mode ---------------- */
  var draft;

  function renderMaker() {
    document.getElementById('sound').hidden = false;
    app.innerHTML =
      '<header class="head">' +
        '<span class="mark"><span class="dot">&#9993;</span> Paper Plane</span>' +
        '<h1>Write someone<br>a card worth keeping</h1>' +
        '<p class="lede">Type your letter, pick an envelope and a tune, then send one link. They open it like real post &mdash; no app, no account.</p>' +
      '</header>' +
      '<div class="cols">' +
        '<section class="panel">' +
          '<div class="two">' +
            '<div class="field"><label class="lbl" for="f-to">To</label><input type="text" id="f-to" maxlength="28"></div>' +
            '<div class="field"><label class="lbl" for="f-from">From</label><input type="text" id="f-from" maxlength="28"></div>' +
          '</div>' +
          '<div class="field"><label class="lbl" for="f-head">Big line</label><input type="text" id="f-head" maxlength="40">' +
            '<span class="hint">The first thing they read. "Happy birthday", "Congratulations", "Thank you".</span></div>' +
          '<div class="field"><label class="lbl" for="f-msg">Your letter</label><textarea id="f-msg" maxlength="700"></textarea>' +
            '<span class="hint"><span id="count"></span> characters left</span></div>' +
          '<div class="field"><span class="lbl">Photo</span>' +
            '<div class="pills"><button class="pill" id="pic">Include photo.jpg</button></div>' +
            '<span class="hint">Put a picture named <b>photo.jpg</b> in the same folder as this page and it appears inside the letter.</span></div>' +
        '</section>' +
        '<section class="panel stick">' +
          '<div class="stage">' +
            '<span class="eyebrow">Live preview</span>' +
            '<div id="prev"></div>' +
            '<span class="hint">Tap the envelope to peek inside</span>' +
          '</div>' +
          '<div class="field"><span class="lbl">Envelope colour</span><div class="swatches" id="sw"></div></div>' +
          '<div class="field"><span class="lbl">Doodles</span><div class="pills" id="pat"></div></div>' +
          '<div class="field"><span class="lbl">Music</span><div class="pills" id="tn"></div>' +
            '<span class="hint">Played in the browser. Nothing to download.</span></div>' +
          '<button class="btn sun" id="make">Copy the link &#10022;</button>' +
          '<button class="btn ghost sm" id="try">Open it the way they will</button>' +
          '<div class="field" id="linkField" hidden><span class="lbl">Your link</span>' +
            '<input type="text" id="linkbox" readonly><span class="hint">Paste it into WhatsApp, a text, or an email.</span></div>' +
        '</section>' +
      '</div>';

    $('#f-to').value = draft.to;
    $('#f-from').value = draft.from;
    $('#f-head').value = draft.headline;
    $('#f-msg').value = draft.message;
    bind('f-to', 'to'); bind('f-from', 'from'); bind('f-head', 'headline'); bind('f-msg', 'message');
    count();

    var sw = $('#sw');
    COLOURS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'sw'; b.style.background = c.hex; b.title = c.name;
      b.setAttribute('aria-label', c.name);
      b.setAttribute('aria-pressed', String(draft.colour === c.id));
      b.addEventListener('click', function () {
        draft.colour = c.id;
        document.documentElement.style.setProperty('--accent', c.hex);
        [].forEach.call(sw.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        preview();
      });
      sw.appendChild(b);
    });
    document.documentElement.style.setProperty('--accent', hex(draft.colour));

    choices('#pat', Object.keys(PATTERNS), function (k) { return PATTERN_NAMES[k]; },
      function () { return draft.pattern; },
      function (k) { draft.pattern = k; preview(); });

    choices('#tn', Object.keys(TUNES), function (k) { return TUNE_NAMES[k]; },
      function () { return draft.tune; },
      function (k) {
        draft.tune = k; tune = k;
        music(false);
        if (k !== 'none') setTimeout(function () { music(true); }, 60);
      });

    var picBtn = $('#pic');
    picBtn.setAttribute('aria-pressed', String(!!draft.photo));
    picBtn.addEventListener('click', function () {
      draft.photo = !draft.photo;
      picBtn.setAttribute('aria-pressed', String(draft.photo));
      toast(draft.photo ? 'The letter will show photo.jpg' : 'No photo in the letter');
    });

    $('#make').addEventListener('click', function () {
      var url = location.origin + location.pathname + '?c=' + encode(draft);
      $('#linkField').hidden = false;
      var box = $('#linkbox');
      box.value = url;
      box.select();
      var done = function () { toast('Link copied. Send it to ' + (draft.to || 'them')); rain(90); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () { toast('Copy the link from the box below'); });
      } else {
        try { document.execCommand('copy'); done(); } catch (e) { toast('Copy the link from the box below'); }
      }
    });

    $('#try').addEventListener('click', function () {
      music(false);
      renderCard(JSON.parse(JSON.stringify(draft)));
      toast('This is their view. "Make your own" brings you back.');
    });

    preview();
  }

  function choices(sel, keys, label, current, pick) {
    var box = $(sel);
    box.innerHTML = '';
    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'pill'; b.textContent = label(k);
      b.setAttribute('aria-pressed', String(current() === k));
      b.addEventListener('click', function () {
        pick(k);
        [].forEach.call(box.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      });
      box.appendChild(b);
    });
  }

  function bind(id, key) {
    var el = document.getElementById(id);
    el.addEventListener('input', function () { draft[key] = el.value; count(); preview(); });
  }
  function count() { var c = $('#count'); if (c) c.textContent = String(700 - (draft.message || '').length); }

  function preview() {
    var p = $('#prev');
    if (!p) return;
    p.innerHTML = envelopeHTML(draft, (draft.headline || 'hello').slice(0, 24));
    var e = document.getElementById('env');
    e.addEventListener('click', function () {
      e.className = e.className.indexOf('open') > -1 ? e.className.replace(' open', '') : e.className + ' open';
    });
  }

  /* ---------------- boot ---------------- */
  var m = location.search.match(/[?&]c=([^&]+)/);
  var incoming = m ? decode(decodeURIComponent(m[1])) : null;
  if (incoming && incoming.to) {
    renderCard(incoming);
  } else {
    draft = JSON.parse(JSON.stringify(DEFAULT));
    renderMaker();
  }
})();
</script>
</body>
</html>
