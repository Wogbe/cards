<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Plane — write someone a card</title>
<meta name="description" content="Write a letter, pick the envelope and the paper, add a song, and send one link.">
<meta property="og:title" content="You have a letter">
<meta property="og:description" content="Tap to open it.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FBF3E4">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Shadows+Into+Light&family=Gloria+Hallelujah&display=swap">
<style>
  /* Cream grid-paper workbench: edit on the left, live envelope on the right,
     a full-screen preview before sending. With ?c= in the address the page
     becomes the card itself. */
  :root {
    --paper: #FBF3E4;
    --paper-2: #FFFBF2;
    --grid: rgba(26,22,20,.055);
    --ink: #17120F;
    --ink-soft: #6B5F55;
    --line: rgba(23,18,15,.14);
    --sun: #F5B931;
    --candy: #FF5FA2;
    --sky: #35B6F2;
    --grass: #2FCF9E;
    --coral: #FF6B4A;
    --grape: #9B7BFF;
    --accent: var(--sun);
    --display: 'Fredoka', 'Trebuchet MS', sans-serif;
    --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --hand: 'Caveat', 'Bradley Hand', cursive;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); font-size: 15px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 26px 26px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 26px 26px,
      radial-gradient(120% 70% at 50% -10%, #FFF9ED 0%, transparent 60%),
      var(--paper);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  .wrap {
    max-width: 1120px; margin: 0 auto;
    padding-block: calc(26px + env(safe-area-inset-top, 0px)) 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100%;
  }

  h1, h2 { font-family: var(--display); margin: 0; font-weight: 600; text-wrap: balance; line-height: 1.05; }
  h1 { font-size: clamp(2.3rem, 7vw, 3.9rem); letter-spacing: -.02em; }
  p { margin: 0; line-height: 1.6; color: var(--ink-soft); }
  .lede { font-size: clamp(1rem, 2.6vw, 1.12rem); max-width: 46ch; }
  .eyebrow { font-family: var(--display); font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }

  .btn {
    font-family: var(--display); font-weight: 600;
    background: var(--ink); color: var(--paper-2);
    padding: 13px 26px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 4px 0 rgba(23,18,15,.25);
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(23,18,15,.25); }
  .btn.sun { background: var(--accent); color: var(--ink); box-shadow: 0 4px 0 rgba(23,18,15,.2); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.ghost:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.sm { padding: 9px 18px; font-size: .92rem; box-shadow: none; }
  .btn.wide { width: 100%; }

  .head { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; margin-bottom: 30px; }
  .mark { display: inline-flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 600; font-size: 1.02rem; }
  .mark .dot { width: 28px; height: 28px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; font-size: .95rem; }

  .cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,.9fr); gap: 26px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: minmax(0,1fr); } }

  .panel {
    background: var(--paper-2); border: 1.5px solid var(--line); border-radius: 26px;
    padding: 22px; box-shadow: 0 14px 34px rgba(23,18,15,.07);
    display: flex; flex-direction: column; gap: 18px; min-width: 0;
  }
  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .lbl { font-family: var(--display); font-size: .86rem; font-weight: 600; }
  .hint { font-size: .78rem; color: var(--ink-soft); }
  input[type=text], textarea {
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 11px 13px; width: 100%; font-size: .98rem;
  }
  textarea { font-family: var(--hand); font-size: 1.3rem; line-height: 1.35; resize: vertical; min-height: 150px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 440px) { .two { grid-template-columns: 1fr; } }

  .swatches { display: flex; flex-wrap: wrap; gap: 9px; }
  .sw { width: 36px; height: 36px; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(23,18,15,.12); transition: transform .14s ease; }
  .sw[aria-pressed="true"] { transform: scale(1.12); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 3px var(--paper-2), 0 0 0 5px var(--ink); }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font-family: var(--display); font-size: .88rem; font-weight: 500;
    padding: 8px 15px; border-radius: 999px;
    background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--paper-2); box-shadow: none; }

  .stick { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
  .stage {
    background: var(--paper-2); border: 1.5px solid var(--line); border-radius: 26px;
    padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 14px 34px rgba(23,18,15,.07);
  }

  /* ---------------- envelopes ---------------- */
  .env {
    position: relative; width: min(320px, 78vw); aspect-ratio: 7 / 5;
    border-radius: 16px; background: var(--env-bg, var(--accent));
    box-shadow: 0 18px 40px rgba(23,18,15,.22);
    overflow: visible;
  }
  .env .body { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; z-index: 1; }
  .env .flap {
    position: absolute; inset: 0 0 auto; height: 60%;
    background: rgba(255,255,255,.26);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 16px 16px 0 0;
    transform-origin: top; transition: transform .6s cubic-bezier(.5,-.25,.3,1.4);
    z-index: 3;
  }
  .env.open .flap { transform: rotateX(178deg); }
  .env .seal {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%); z-index: 4;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--candy); color: #fff;
    display: grid; place-items: center;
    font-family: var(--display); font-size: 1.5rem; font-weight: 600;
    box-shadow: 0 5px 14px rgba(23,18,15,.3), inset 0 0 0 3px rgba(255,255,255,.35);
    transition: transform .4s ease, opacity .3s;
  }
  .env.open .seal { transform: translate(-50%,-50%) scale(0) rotate(160deg); opacity: 0; }
  .env .stamp {
    position: absolute; right: 12px; top: 12px; z-index: 4;
    width: 54px; height: 62px; border-radius: 6px; background: var(--paper-2);
    box-shadow: 0 3px 10px rgba(23,18,15,.22);
    display: grid; place-items: center; padding: 4px;
    font-family: var(--display); font-size: .58rem; text-align: center; line-height: 1.15;
    transform: rotate(3deg);
  }
  .env .stamp b { font-size: 1.1rem; display: block; }
  .env .deco { position: absolute; inset: 0; overflow: hidden; border-radius: 16px; z-index: 2; pointer-events: none; }
  .env .deco span { position: absolute; font-size: 18px; opacity: .55; }
  .env .letter-peek {
    position: absolute; left: 7%; right: 7%; bottom: 8%; height: 62%; z-index: 2;
    background: var(--paper-2); border-radius: 10px;
    box-shadow: 0 -2px 10px rgba(23,18,15,.12);
    display: grid; place-items: center; padding: 10px;
    font-family: var(--hand); font-size: 1.15rem; color: var(--ink-soft); text-align: center;
    transition: transform .55s ease .1s;
  }
  .env.open .letter-peek { transform: translateY(-24%); }

  /* Airmail: white card with the striped border and a par-avion mark. */
  .env.airmail { --env-bg: #FDFBF6; }
  .env.airmail .body {
    border: 7px solid transparent;
    background:
      linear-gradient(#FDFBF6, #FDFBF6) padding-box,
      repeating-linear-gradient(45deg, #D83A3A 0 10px, #FDFBF6 10px 20px, #2B5CB8 20px 30px, #FDFBF6 30px 40px) border-box;
  }
  .env.airmail .flap { background: rgba(43,92,184,.12); }
  .env.airmail .seal { background: #2B5CB8; }
  .env.airmail .mark {
    position: absolute; left: 14px; bottom: 12px; z-index: 4;
    font-family: var(--display); font-size: .6rem; letter-spacing: .2em;
    text-transform: uppercase; color: #2B5CB8;
  }

  /* Window: a cut-out panel showing who it is for. */
  .env.window .pane {
    position: absolute; left: 10%; bottom: 14%; width: 56%; height: 28%; z-index: 4;
    background: rgba(255,255,255,.9); border-radius: 6px;
    box-shadow: inset 0 0 0 1.5px rgba(23,18,15,.14);
    display: grid; place-items: center; padding: 4px;
    font-family: var(--display); font-size: .82rem; color: var(--ink);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .env.window .letter-peek { bottom: 46%; height: 36%; }

  /* Kraft: brown paper, grain, and a twine cross. */
  .env.kraft { --env-bg: #D7B183; }
  .env.kraft .body {
    background-image: radial-gradient(rgba(90,60,30,.12) 1px, transparent 1px);
    background-size: 7px 7px;
  }
  .env.kraft .flap { background: rgba(120,84,44,.22); }
  .env.kraft .twine {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background:
      linear-gradient(to right, transparent calc(50% - 1.5px), rgba(90,62,32,.65) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(to bottom, transparent calc(60% - 1.5px), rgba(90,62,32,.65) calc(60% - 1.5px) calc(60% + 1.5px), transparent calc(60% + 1.5px));
  }
  .env.kraft .seal { background: #A23B2A; }

  /* Band: flat modern envelope, a colour band instead of a triangle flap. */
  .env.band .flap {
    height: 34%; clip-path: none; border-radius: 16px 16px 0 0;
    background: rgba(23,18,15,.14);
    transform-origin: top;
  }
  .env.band.open .flap { transform: rotateX(178deg); }
  .env.band .seal { top: 34%; width: 52px; height: 52px; border-radius: 14px; }
  .env.band .letter-peek { bottom: 10%; height: 56%; }

  /* Postcard: no flap at all, a postmark and a written address. */
  .env.postcard { --env-bg: #F7EEDC; }
  .env.postcard .flap { display: none; }
  .env.postcard .letter-peek {
    left: 5%; right: 5%; bottom: 6%; height: 88%;
    background: #FFFDF7; box-shadow: inset 0 0 0 1.5px rgba(23,18,15,.12);
    display: block; text-align: left; padding: 14px 16px;
  }
  .env.postcard.open .letter-peek { transform: translateY(-6%) rotate(-1.5deg); }
  .env.postcard .postmark {
    position: absolute; right: 16px; top: 16px; z-index: 5;
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px dashed rgba(23,18,15,.45);
    display: grid; place-items: center; transform: rotate(-12deg);
    font-family: var(--display); font-size: .55rem; text-align: center;
    color: rgba(23,18,15,.6); line-height: 1.1;
  }
  .env.postcard .seal { left: auto; right: 22px; bottom: 16px; top: auto; transform: none; width: 44px; height: 44px; font-size: 1.1rem; }
  .env.postcard.open .seal { transform: scale(0) rotate(160deg); }
  .env.postcard .stamp { display: none; }

  .tapnote { font-family: var(--display); font-size: .86rem; color: var(--ink-soft); }

  /* ---------------- the letter and its papers ---------------- */
  .letter {
    --sheet: #FFFBF2; --sheet-ink: #17120F; --sheet-soft: #6B5F55;
    background: var(--sheet); color: var(--sheet-ink);
    border-radius: 24px; padding: 26px 24px 28px;
    box-shadow: 0 22px 50px rgba(23,18,15,.18); border: 1.5px solid var(--line);
    width: 100%; max-width: 540px;
    display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center;
    animation: rise .55s cubic-bezier(.2,.9,.3,1) both;
  }
  .letter.kraft {
    --sheet: #DEBB8C; --sheet-ink: #3B2A17; --sheet-soft: #6E553A;
    background-image: radial-gradient(rgba(90,60,30,.09) 1px, transparent 1px);
    background-size: 7px 7px;
  }
  .letter.stripe { background-image: repeating-linear-gradient(90deg, rgba(23,18,15,.045) 0 10px, transparent 10px 22px); }
  .letter.ruled { background-image: repeating-linear-gradient(transparent 0 31px, rgba(53,182,242,.25) 31px 32px); }
  .letter.midnight {
    --sheet: #1D1B33; --sheet-ink: #F6F1E6; --sheet-soft: #B8B2CC;
    border-color: rgba(255,255,255,.12);
    background-image: radial-gradient(rgba(255,255,255,.5) .9px, transparent 1px);
    background-size: 24px 24px;
  }
  .letter .photo { width: 100%; max-width: 320px; aspect-ratio: 4/3; object-fit: cover; border-radius: 16px; transform: rotate(-1.4deg); box-shadow: 0 10px 24px rgba(23,18,15,.25); }
  .letter .msg { font-family: var(--hand); font-size: clamp(1.35rem, 5vw, 1.72rem); line-height: 1.38; color: var(--sheet-ink); white-space: pre-wrap; max-width: 30ch; }
  .letter .sign { font-family: var(--hand); font-size: clamp(1.4rem, 5.4vw, 1.85rem); font-weight: 700; color: var(--candy); }
  .letter.midnight .sign { color: var(--sun); }
  .letter .to { font-family: var(--display); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; color: var(--sheet-soft); }
  .letter h1 { color: var(--sheet-ink); }
  .letter .song { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; }
  .letter .song .cap { font-family: var(--display); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--sheet-soft); }
  .letter iframe { width: 100%; border: 0; border-radius: 14px; display: block; }
  .letter iframe.yt { aspect-ratio: 16/9; height: auto; }

  .card-stage { min-height: calc(100vh - 110px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }

  .previewbar {
    position: fixed; left: 0; right: 0; z-index: 75;
    bottom: 0; padding: 12px max(16px, env(safe-area-inset-left, 0px));
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(251,243,228,.94); backdrop-filter: blur(8px);
    border-top: 1.5px solid var(--line);
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }

  .sound {
    position: fixed; z-index: 70;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + max(4px, env(safe-area-inset-right, 0px)));
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--paper-2); box-shadow: 0 4px 14px rgba(23,18,15,.18), inset 0 0 0 1.5px var(--line);
    display: grid; place-items: center; font-size: 1.1rem;
  }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 80;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper-2);
    font-family: var(--display); font-size: .92rem;
    padding: 11px 20px; border-radius: 999px;
    box-shadow: 0 10px 24px rgba(23,18,15,.3); max-width: 90vw;
  }

  .linkbox { display: flex; flex-direction: column; gap: 8px; }
  .linkbox textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .74rem; min-height: 72px; line-height: 1.35; }

  @keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
  .floaty { animation: float 3.6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<button class="sound" id="sound" hidden aria-pressed="false" aria-label="Play music">&#9834;</button>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  var DEFAULT = {
    to: "Sefenya",
    from: "David",
    headline: "Happy birthday",
    message: "The world got a lot brighter the day you showed up in it.\n\nThank you for the laughing, the patience, and for being you without ever trying. Here's to a year that treats you as well as you treat everyone else.",
    colour: "sun",
    style: "classic",
    pattern: "confetti",
    tune: "bounce",
    photo: "",
    shot: "",
    song: "",
    reply: "",
    pen: "caveat",
    sheet: "cream"
  };

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var app = document.getElementById('app');
  var $ = function (s, r) { return (r || document).querySelector(s); };

  var COLOURS = [
    { id: 'sun', hex: '#F5B931', name: 'Sunshine' },
    { id: 'candy', hex: '#FF5FA2', name: 'Candy' },
    { id: 'sky', hex: '#35B6F2', name: 'Sky' },
    { id: 'grass', hex: '#2FCF9E', name: 'Grass' },
    { id: 'coral', hex: '#FF6B4A', name: 'Coral' },
    { id: 'grape', hex: '#9B7BFF', name: 'Grape' }
  ];
  var STYLES = { classic: 'Classic', airmail: 'Airmail', window: 'Window', kraft: 'Kraft & twine', band: 'Modern band', postcard: 'Postcard' };
  /* Airmail, kraft and postcard carry their own paper colour. */
  var FIXED_COLOUR = { airmail: 1, kraft: 1, postcard: 1 };
  var PATTERNS = {
    none: [],
    confetti: ['✦', '●', '▲', '✦', '●', '■', '✦', '●', '▲', '■', '✦', '●'],
    flowers: ['✿', '❀', '✿', '❁', '❀', '✿', '❁', '✿', '❀', '✿'],
    stars: ['✧', '★', '✦', '✧', '★', '✦', '✧', '★', '✦', '✧'],
    hearts: ['♥', '♡', '♥', '♡', '♥', '♡', '♥', '♡', '♥']
  };
  var TUNES = {
    none: null,
    bounce: [523, 659, 784, 659, 880, 784, 659, 587, 523, 659, 1047, 988, 784, 659, 587, 523],
    box: [1047, 1319, 1568, 1319, 1047, 880, 1047, 1319, 988, 1175, 1480, 1175, 988, 784, 988, 1175],
    warm: [392, 494, 587, 494, 440, 523, 659, 523, 392, 494, 587, 698, 587, 494, 440, 392]
  };
  var TUNE_NAMES = { none: 'No tune', bounce: 'Party bounce', box: 'Music box', warm: 'Warm and slow' };
  var PATTERN_NAMES = { none: 'Plain', confetti: 'Confetti', flowers: 'Flowers', stars: 'Stars', hearts: 'Hearts' };
  var PENS = {
    caveat: "'Caveat', cursive",
    patrick: "'Patrick Hand', cursive",
    shadows: "'Shadows Into Light', cursive",
    gloria: "'Gloria Hallelujah', cursive"
  };
  var PEN_NAMES = { caveat: 'Flowing', patrick: 'Neat', shadows: 'Light', gloria: 'Chunky' };
  var SHEETS = { cream: 'Cream', kraft: 'Kraft', stripe: 'Striped', ruled: 'Ruled', midnight: 'Midnight' };

  function hex(id) {
    for (var i = 0; i < COLOURS.length; i++) if (COLOURS[i].id === id) return COLOURS[i].hex;
    return COLOURS[0].hex;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------------- songs ---------------- */
  function songToken(raw) {
    var s = String(raw || '').trim();
    if (!s) return '';
    var m = s.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
    if (m) return 'y:' + m[1];
    m = s.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode)\/([A-Za-z0-9]{10,40})/);
    if (m) return 's:' + m[1] + '/' + m[2];
    if (/^y:[A-Za-z0-9_-]{6,20}$/.test(s)) return s;
    if (/^s:(track|album|playlist|episode)\/[A-Za-z0-9]{10,40}$/.test(s)) return s;
    return '';
  }
  function songEmbed(token) {
    if (!token) return '';
    if (token.slice(0, 2) === 'y:') {
      var id = token.slice(2);
      if (!/^[A-Za-z0-9_-]{6,20}$/.test(id)) return '';
      return '<div class="song"><span class="cap">Press play</span>' +
        '<iframe class="yt" src="https://www.youtube-nocookie.com/embed/' + id + '" title="Song" ' +
        'allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
    }
    if (token.slice(0, 2) === 's:') {
      var path = token.slice(2);
      if (!/^(track|album|playlist|episode)\/[A-Za-z0-9]{10,40}$/.test(path)) return '';
      return '<div class="song"><span class="cap">Press play</span>' +
        '<iframe src="https://open.spotify.com/embed/' + path + '" title="Song" height="152" ' +
        'allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>';
    }

  }

  /* ---------------- reply ---------------- */
  function replyHref(who) {
    who = String(who || '').trim();
    if (!who) return '';
    var note = 'Thank you for my card';
    if (who.indexOf('@') > -1 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(who)) {
      return 'mailto:' + who + '?subject=' + encodeURIComponent(note);
    }
    var digits = who.replace(/[^0-9]/g, '');
    if (digits.length < 7) return '';
    return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(note);
  }
  function replyHTML(d) {
    var href = replyHref(d.reply);
    if (!href) return '';
    var mail = href.slice(0, 7) === 'mailto:';

      (mail ? '' : ' target="_blank" rel="noopener"') + '>Say thank you</a>';

  /* ---------------- link encoding ---------------- */
  function b64url(bin) {
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64url(s) {
    var b = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    return b;
  }
  /* Plain text costs one character per letter here, where base64 cost four for
     every three. A whole card is usually under 600 characters, which keeps
     chat apps happy. Fields are separated by ~, so a typed ~ is escaped. */
  var FIELDS = ['to', 'from', 'headline', 'message', 'colour', 'pattern', 'tune',
    'photo', 'song', 'reply', 'pen', 'sheet', 'style'];

  function packField(v) {
    return encodeURIComponent(String(v == null ? '' : v))
      .replace(/~/g, '%7E').replace(/%20/g, '+');
  }
  function unpackField(v) {
    return decodeURIComponent(String(v).replace(/\+/g, '%20'));
  }
  function encode(d) {
    var out = ['1'];
    for (var i = 0; i < FIELDS.length; i++) out.push(packField(d[FIELDS[i]] || ''));
    return out.join('~');
  }
  function decode(s) {
    var raw = String(s || '');
    if (raw.slice(0, 2) === '1~') {
      try {
        var parts = raw.split('~'), d = { shot: '' };
        if (parts.length < 5) return null;
        for (var i = 0; i < FIELDS.length; i++) d[FIELDS[i]] = unpackField(parts[i + 1] || '');
        d.colour = d.colour || 'sun';
        d.pattern = d.pattern || 'none';
        d.tune = d.tune || 'none';
        d.pen = d.pen || 'caveat';
        d.sheet = d.sheet || 'cream';
        d.style = d.style || 'classic';
        return d;
      } catch (e) { return null; }
    }
    /* Cards sent before this change still open. */
    try {
      var bin = atob(unb64url(decodeURIComponent(raw))), bytes = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      var a = JSON.parse(new TextDecoder().decode(bytes));
      if (!a || !a.length) return null;
      return { to: a[0], from: a[1], headline: a[2], message: a[3], colour: a[4] || 'sun',
        pattern: a[5] || 'none', tune: a[6] || 'none', photo: a[7] || '', song: a[8] || '',
        reply: a[9] || '', pen: a[10] || 'caveat', sheet: a[11] || 'cream',
        style: a[12] || 'classic', shot: '' };
    } catch (e) { return null; }
  }
  function cardUrl(d) {
    return location.origin + location.pathname + '?c=' + encode(d) +
      (d.shot ? '&p=' + d.shot.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : '');
  }

  /* ---------------- confetti ---------------- */
  var cv = document.getElementById('sky'), ctx = cv.getContext('2d'), bits = [], running = false;
  function sizeSky() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  sizeSky();
  addEventListener('resize', sizeSky);
  function burst(x, y, n) {
    if (reduce) return;
    var pal = ['#F5B931', '#FF5FA2', '#35B6F2', '#2FCF9E', '#FF6B4A', '#9B7BFF'];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
      bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
        c: pal[(Math.random() * pal.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        life: 110 + Math.random() * 60 });
    }
    if (bits.length > 800) bits.splice(0, bits.length - 800);
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function rain(n) { if (reduce) return; for (var i = 0; i < n; i++) burst(Math.random() * innerWidth, -20 - Math.random() * 140, 1); }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      b.vy += .22; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
      if (b.life < 0 || b.y > innerHeight + 60) { bits.splice(i, 1); continue; }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.globalAlpha = Math.min(1, b.life / 40); ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    }
    if (bits.length) requestAnimationFrame(tick); else running = false;
  }

  /* ---------------- the little tune ---------------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, gain = null, loopId = null, playing = false, tune = 'bounce';
  function startAudio() {
    if (!AC) return false;
    try {
      if (!ac) { ac = new AC(); gain = ac.createGain(); gain.gain.value = .13; gain.connect(ac.destination); }
      if (ac.state === 'suspended') ac.resume();
      return true;
    } catch (e) { return false; }
  }
  function note(f, at, dur, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol, at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(gain); o.start(at); o.stop(at + dur + .05);
  }
  function loopTune() {
    var seq = TUNES[tune];
    if (!seq || !ac) return;
    var step = tune === 'warm' ? .3 : .22, t = ac.currentTime + .05;
    for (var i = 0; i < seq.length; i++) {
      note(seq[i], t + i * step, step * .9, .55);
      if (i % 4 === 0) note(seq[i] / 2, t + i * step, step * 1.8, .3);
    }
    loopId = setTimeout(loopTune, seq.length * step * 1000);
  }
  function music(on) {
    playing = on;

    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? 'Mute music' : 'Play music');
    b.innerHTML = on ? '&#9835;' : '&#9834;';
    if (on) { if (startAudio()) { gain.gain.setTargetAtTime(.13, ac.currentTime, .05); loopTune(); } }
    else { clearTimeout(loopId); if (gain && ac) gain.gain.setTargetAtTime(0, ac.currentTime, .05); }
  }

      var img = new Image();
      img.onload = function () {
        var max = 460, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s));
        c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var q = [0.6, 0.5, 0.42, 0.35, 0.28, 0.22], url = '';
        for (var i = 0; i < q.length; i++) {
          url = c.toDataURL('image/jpeg', q[i]);
          if (url.length < 40000) break;
        }
        draft.shot = url.split(',')[1] || '';
        draft.photo = '';
        if ($('#f-pic')) $('#f-pic').value = '';
        $('#picNote').textContent = 'Photo ready, about ' + Math.round(draft.shot.length / 1024) + ' KB.';
        picPreview();
        toast('Photo added');
      };
      img.onerror = function () { $('#picNote').textContent = 'That file would not open as a picture.'; };
      img.src = r.result;
    };
    r.onerror = function () { $('#picNote').textContent = 'Could not read that file.'; };
    r.readAsDataURL(file);
  }

  function picPreview() {
    var box = $('#picPrev');
    if (!box) return;
    var drop = $('#dropPic');
    if (drop) drop.hidden = !draft.shot;
    var style = 'margin-top:8px;width:120px;height:90px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line)';
    if (draft.shot) {
      box.innerHTML = '<img id="shotPrev" src="data:image/jpeg;base64,' + draft.shot + '" alt="Chosen photo" style="' + style + '">';
      return;
    }
    if (!draft.photo) { box.innerHTML = ''; return; }
    box.innerHTML = '<img src="' + esc(draft.photo) + '" alt="" style="' + style + '" ' +
      'onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),' +
      '{className:\'hint\',textContent:\'No file by that name on the site yet.\'}))">';
  }

  function preview() {
    var p = $('#prev');
    if (!p) return;
    p.innerHTML = envelopeHTML(draft, (draft.headline || 'hello').slice(0, 24));
    var e = document.getElementById('env');
    e.addEventListener('click', function () {
      e.className = e.className.indexOf(' open') > -1
        ? e.className.replace(' open', '') : e.className + ' open';
    });
  }

  /* One place that builds, shows and copies the link, so the box always holds
     exactly what the clipboard holds. */
  function copyLink(d) {
    var url = cardUrl(d);
    var field = $('#linkField');
    if (field) {
      field.hidden = false;
      $('#linkbox').value = url;
      $('#openLink').href = url;
      $('#waLink').href = 'https://wa.me/?text=' + encodeURIComponent('A letter for you: ' + url);
      $('#linkNote').textContent = url.length.toLocaleString() + ' characters' +
        (d.shot ? '. A photo inside the link makes it very long; chat apps may not turn it blue. Use a photo stored on the site for a short link.' : '.');
    }
    var done = function () { toast('Link copied. Send it to ' + (d.to || 'them')); rain(70); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { manualCopy(url); });
    } else {
      manualCopy(url);
    }
    return url;
  }
  function manualCopy(url) {
    var box = $('#linkbox');
    if (box) {
      box.focus(); box.select();
      try {
        if (document.execCommand('copy')) { toast('Link copied'); return; }
      } catch (e) { /* falls through to the message below */ }
    }
    toast('Select the link above and copy it');
  }

  function brokenLink() {
    app.innerHTML =
      '<div class="card-stage">' +
        '<h1>This card did not arrive whole</h1>' +
        '<p class="lede" style="text-align:center">The link was cut short somewhere between the sender and here. ' +
        'Ask them to send it again, pasted as plain text.</p>' +
        '<button class="btn sun" id="mine">Write your own card</button>' +
      '</div>';
    $('#mine').addEventListener('click', function () { location.href = location.pathname; });
  }

  /* ---------------- boot ---------------- */
  var m = location.search.match(/[?&]c=([^&]*)/);
  if (m) {
    var incoming = decode(decodeURIComponent(m[1]));
    if (incoming && incoming.to) {
      var sp = location.search.match(/[?&]p=([^&]+)/);
      if (sp) {
        var raw = unb64url(decodeURIComponent(sp[1]));
        if (/^[A-Za-z0-9+/=]+$/.test(raw)) incoming.shot = raw;
      }
      renderCard(incoming);
    } else {
      brokenLink();
    }
  } else {
    applyPen(draft);
    renderMaker();
  }
})();
</script>
</body>
</html>
